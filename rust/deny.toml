[advisories]
ignore = [
  "RUSTSEC-2022-0061", # parity-wasm deprecated, no fix; via fvm v2 (fvm-wasm-instrument 0.2)
  "RUSTSEC-2024-0375", # atty unmaintained, no fix; via fil_logger's flexi_logger
  "RUSTSEC-2024-0436", # paste unmaintained, no fix; via safer-ffi
  "RUSTSEC-2025-0141", # bincode unmaintained, transitive dep via bellperson/filecoin-proofs
  "RUSTSEC-2026-0387", # crypto-bigint 0.5 timing (via k256), fixed only in 0.7; shipped code only verifies/recovers public signatures
]

[bans]
multiple-versions = "allow"

[sources]
allow-git = [ "https://github.com/curiostorage/sppark.git" ]

[licenses]
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "CC0-1.0",
  "MIT",
  "Unlicense",
  "Unicode-3.0",
  "Zlib",
]
